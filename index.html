<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電商神助手 - 任務報價與請款管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;padding:1rem;min-height:100vh}
.app{display:grid;grid-template-columns:340px 1fr;min-height:600px;gap:0;border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff;max-width:1200px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.sidebar{background:#fafaf8;border-right:1px solid #e8e8e8;padding:1.25rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
.main{display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #e8e8e8}
h1{font-size:15px;font-weight:600;color:#1a1a1a}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap;display:inline-block}
.badge-blue{background:#E6F1FB;color:#185FA5}
.badge-green{background:#EAF3DE;color:#3B6D11}
.badge-amber{background:#FAEEDA;color:#854F0B}
.badge-gray{background:#F1EFE8;color:#5F5E5A}
.section-title{font-size:11px;font-weight:600;color:#888;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.form-group label{font-size:12px;color:#666}
.form-group input,.form-group select,.form-group textarea{font-size:13px;padding:6px 10px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;color:#1a1a1a;width:100%;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#378ADD}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;border:1px solid #d0d0d0;background:#fff;color:#1a1a1a;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn:hover{background:#f5f5f5}
.btn:active{transform:scale(0.98)}
.btn-primary{background:#185FA5;color:#fff;border-color:#185FA5}
.btn-primary:hover{background:#0C447C;border-color:#0C447C}
.btn-sm{font-size:12px;padding:4px 10px}
.btn-danger{color:#A32D2D;border-color:#A32D2D}
.btn-danger:hover{background:#FCEBEB}
.btn-success{color:#3B6D11;border-color:#3B6D11}
.btn-success:hover{background:#EAF3DE}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px}
.checkbox-row input{width:auto}
.toolbar{display:flex;align-items:center;gap:8px;padding:.75rem 1.25rem;border-bottom:1px solid #e8e8e8;flex-wrap:wrap}
.filter-tabs{display:flex;gap:4px}
.tab{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid #e0e0e0;background:transparent;color:#888;cursor:pointer}
.tab.active{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4}
.spacer{flex:1}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:1rem 1.25rem;border-bottom:1px solid #e8e8e8}
.stat{background:#fafaf8;border-radius:8px;padding:.75rem 1rem;text-align:center}
.stat-label{font-size:11px;color:#888;margin-bottom:4px}
.stat-val{font-size:18px;font-weight:600;color:#1a1a1a}
.stat-val.blue{color:#185FA5}
.stat-val.green{color:#3B6D11}
.stat-val.amber{color:#854F0B}
.table-wrap{overflow-x:auto;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:11px;font-weight:600;color:#888;text-align:left;padding:8px 12px;border-bottom:1px solid #e8e8e8;position:sticky;top:0;background:#fff;white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f0f0;transition:background .1s}
tbody tr:hover{background:#fafaf8}
tbody tr.selected{background:#E6F1FB}
tbody td{padding:8px 12px;color:#1a1a1a;vertical-align:middle}
.amount-cell{font-weight:600;white-space:nowrap}
.actions-cell{display:flex;gap:6px;align-items:center}
.empty{text-align:center;padding:3rem;color:#aaa;font-size:13px}
.doc-panel{border-top:1px solid #e8e8e8;background:#fafaf8;padding:1rem 1.25rem}
.doc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc-type-tabs{display:flex;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden}
.doc-type-tabs button{font-size:12px;padding:5px 14px;border:none;background:transparent;cursor:pointer;color:#888}
.doc-type-tabs button.active{background:#fff;color:#1a1a1a;font-weight:600}
.sel-total{font-size:13px;font-weight:500;color:#888}
.sel-total span{color:#185FA5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:1.5rem;width:480px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-header h2{font-size:15px;font-weight:600}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;border-top:1px solid #e8e8e8;padding-top:1rem}
.inline-edit input{border:1px solid #378ADD;border-radius:4px;padding:2px 6px;font-size:13px;background:#fff;color:#1a1a1a;width:100%}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:8px;font-size:14px;color:#888}
.icon-btn:hover{background:#f0f0f0}

.sync-status{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.sync-ok{background:#EAF3DE;color:#3B6D11}
.sync-err{background:#FCEBEB;color:#A32D2D}
.sync-loading{background:#E6F1FB;color:#185FA5}
.sync-warn{background:#FAEEDA;color:#854F0B}
.gas-input{font-size:12px;padding:5px 8px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;color:#1a1a1a;width:100%;outline:none;margin-bottom:6px}
.gas-input:focus{border-color:#378ADD}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="sidebar">
    <div>
      <div class="section-title">新增項目</div>
      <div class="form-row">
        <div class="form-group"><label>日期</label><input type="date" id="inp-date"></div>
        <div class="form-group"><label>金額 NT$</label><input type="number" id="inp-amount" placeholder="0"></div>
      </div>
      <div class="form-group"><label>客戶名稱</label><input type="text" id="inp-client" placeholder="輸入客戶名稱"></div>
      <div class="form-group"><label>項目名稱</label><input type="text" id="inp-project" placeholder="輸入項目名稱"></div>
      <div class="form-group"><label>詳細內容</label><textarea id="inp-detail" placeholder="詳細說明..."></textarea></div>
      <div class="checkbox-row" style="margin-bottom:12px">
        <input type="checkbox" id="inp-closed">
        <label for="inp-closed" style="font-size:13px;color:#666">已結案 / 已收款</label>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="addItem()">＋ 加入列表</button>
    </div>

    <div style="border-top:1px solid #e8e8e8;padding-top:1rem">
      <div class="section-title">CSV 匯入 / 匯出</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" style="flex:1" onclick="importCSV()">↑ 匯入</button>
        <button class="btn btn-sm" style="flex:1" onclick="exportCSV()">↓ 匯出</button>
      </div>
      <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="handleCSV(event)">
    </div>

    <div style="border-top:1px solid #e8e8e8;padding-top:1rem">
      <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
        <span>🔄 Google Sheets 同步</span>
        <span id="sync-badge" class="sync-status sync-warn" style="text-transform:none;letter-spacing:0">未設定</span>
      </div>
      <input class="gas-input" id="gas-url" placeholder="貼上 Apps Script 網址..." oninput="saveGasUrl()">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button class="btn btn-sm btn-primary" onclick="syncToSheet()" title="將網站資料推送到 Google Sheets">↑ 推送到表單</button>
        <button class="btn btn-sm" onclick="syncFromSheet()" title="從 Google Sheets 拉取資料到網站" style="border-color:#185FA5;color:#185FA5">↓ 從表單拉取</button>
      </div>
      <div style="margin-top:6px;font-size:11px;color:#aaa" id="sync-time"></div>
    </div>

    <div style="border-top:1px solid #e8e8e8;padding-top:1rem">
      <div class="section-title">使用說明</div>
      <ol style="font-size:12px;color:#888;padding-left:1rem;line-height:1.8">
        <li>新增項目後勾選列表中的項目</li>
        <li>下方選擇「請款單」或「報價單」</li>
        <li>點擊「產生文件」預覽並下載</li>
        <li>雙擊表格中任一欄位可直接編輯</li>
      </ol>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h1>電商神助手　任務管理</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm btn-danger" onclick="deleteSelected()" id="btn-del" style="display:none">刪除勾選</button>
        <button class="btn btn-sm btn-success" onclick="markPaidSelected()" id="btn-pay" style="display:none">標記已收款</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat"><div class="stat-label">全部項目</div><div class="stat-val blue" id="stat-total">0</div></div>
      <div class="stat"><div class="stat-label">未收款</div><div class="stat-val amber" id="stat-pending">NT$ 0</div></div>
      <div class="stat"><div class="stat-label">已收款</div><div class="stat-val green" id="stat-paid">NT$ 0</div></div>
    </div>

    <div class="toolbar">
      <div class="filter-tabs">
        <button class="tab active" onclick="setFilter('all',this)">全部</button>
        <button class="tab" onclick="setFilter('open',this)">進行中</button>
        <button class="tab" onclick="setFilter('closed',this)">已結案</button>
      </div>
      <div class="spacer"></div>
      <input type="text" id="search" placeholder="搜尋客戶 / 項目..." style="font-size:12px;padding:5px 10px;border:1px solid #e0e0e0;border-radius:8px;background:#fafaf8;color:#1a1a1a;width:180px;outline:none" oninput="renderTable()">
      <button class="btn btn-sm" onclick="toggleAll()" id="btn-selall">全選</button>
    </div>

    <div class="table-wrap">
      <table id="main-table">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="chk-all" onchange="checkAll(this)"></th>
            <th onclick="sortBy('date')" style="cursor:pointer">日期 ⇅</th>
            <th onclick="sortBy('client')" style="cursor:pointer">客戶 ⇅</th>
            <th onclick="sortBy('project')" style="cursor:pointer">項目 ⇅</th>
            <th>內容</th>
            <th onclick="sortBy('amount')" style="cursor:pointer">金額 ⇅</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="doc-panel">
      <div class="doc-row">
        <div class="doc-type-tabs">
          <button class="active" id="dt-inv" onclick="setDocType('inv')">請款單</button>
          <button id="dt-quo" onclick="setDocType('quo')">報價單</button>
        </div>
        <div class="form-group" style="margin:0;flex:1;max-width:200px">
          <input type="text" id="doc-to" placeholder="文件對象 (客戶名稱)" style="font-size:12px;padding:5px 10px">
        </div>
        <div class="form-group" style="margin:0;width:130px">
          <input type="text" id="doc-no" placeholder="單號" style="font-size:12px;padding:5px 10px">
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#666;white-space:nowrap">
          <input type="checkbox" id="tax-check"> 含 5% 稅
        </label>
        <div class="spacer"></div>
        <div class="sel-total">已勾選 <span id="sel-total-val">NT$ 0</span></div>
        <button class="btn btn-primary btn-sm" onclick="openDocPreview()">產生文件</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-container"></div>

<script>
let data = JSON.parse(localStorage.getItem('inv_data')||'[]');
let filter='all', sortCol='date', sortDir=1, docType='inv';
let nextId = data.length ? Math.max(...data.map(d=>d.id))+1 : 1;

function save(){localStorage.setItem('inv_data',JSON.stringify(data))}
function fmtAmt(n){return 'NT$ '+Number(n).toLocaleString()}
function today(){return new Date().toISOString().split('T')[0]}

document.getElementById('inp-date').value=today();

function addItem(){
  const date=document.getElementById('inp-date').value;
  const client=document.getElementById('inp-client').value.trim();
  const project=document.getElementById('inp-project').value.trim();
  const detail=document.getElementById('inp-detail').value.trim();
  const amount=parseFloat(document.getElementById('inp-amount').value)||0;
  const closed=document.getElementById('inp-closed').checked;
  if(!client||!project){alert('請輸入客戶名稱與項目名稱');return;}
  data.push({id:nextId++,date,client,project,detail,amount,closed,checked:false});
  save();
  document.getElementById('inp-client').value='';
  document.getElementById('inp-project').value='';
  document.getElementById('inp-detail').value='';
  document.getElementById('inp-amount').value='';
  document.getElementById('inp-closed').checked=false;
  renderTable();updateStats();
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  return data.filter(d=>{
    const matchFilter=filter==='all'||(filter==='open'&&!d.closed)||(filter==='closed'&&d.closed);
    const matchQ=!q||(d.client+d.project+d.detail).toLowerCase().includes(q);
    return matchFilter&&matchQ;
  }).sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(sortCol==='amount'){va=Number(va);vb=Number(vb);}
    return va<vb?-sortDir:va>vb?sortDir:0;
  });
}

function renderTable(){
  const rows=getFiltered();
  const tbody=document.getElementById('tbody');
  updateSelectedActions();
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="8"><div class="empty">尚無資料，請從左側新增或調整篩選條件。</div></td></tr>';
    return;
  }
  tbody.innerHTML=rows.map(d=>`
    <tr class="${d.checked?'selected':''}" id="row-${d.id}">
      <td><input type="checkbox" ${d.checked?'checked':''} onchange="toggleCheck(${d.id},this)"></td>
      <td id="cell-date-${d.id}" ondblclick="startEdit(${d.id},'date')">${d.editing==='date'?`<input class='inline-edit' id='edit-${d.id}-date' value='${d.date}' type='date' onblur='commitEdit(${d.id},"date")' onkeydown='editKey(event,${d.id},"date")'>`:`<span>${d.date}</span>`}</td>
      <td id="cell-client-${d.id}" ondblclick="startEdit(${d.id},'client')">${d.editing==='client'?`<input class='inline-edit' id='edit-${d.id}-client' value='${d.client}' onblur='commitEdit(${d.id},"client")' onkeydown='editKey(event,${d.id},"client")'>`:`<span>${d.client}</span>`}</td>
      <td id="cell-project-${d.id}" ondblclick="startEdit(${d.id},'project')">${d.editing==='project'?`<input class='inline-edit' id='edit-${d.id}-project' value='${d.project}' onblur='commitEdit(${d.id},"project")' onkeydown='editKey(event,${d.id},"project")'>`:`<span>${d.project}</span>`}</td>
      <td id="cell-detail-${d.id}" ondblclick="startEdit(${d.id},'detail')" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.detail}">${d.editing==='detail'?`<input class='inline-edit' id='edit-${d.id}-detail' value='${d.detail}' onblur='commitEdit(${d.id},"detail")' onkeydown='editKey(event,${d.id},"detail")'>`:`<span>${d.detail||'—'}</span>`}</td>
      <td class="amount-cell" id="cell-amount-${d.id}" ondblclick="startEdit(${d.id},'amount')">${d.editing==='amount'?`<input class='inline-edit' id='edit-${d.id}-amount' value='${d.amount}' type='number' onblur='commitEdit(${d.id},"amount")' onkeydown='editKey(event,${d.id},"amount")' style='width:90px'>`:`<span>${fmtAmt(d.amount)}</span>`}</td>
      <td style="min-width:72px"><span class="badge ${d.closed?'badge-green':'badge-amber'}">${d.closed?'已收款':'進行中'}</span></td>
      <td class="actions-cell">
        <button class="icon-btn" title="編輯" onclick="openEditModal(${d.id})">✏️</button>
        <button class="icon-btn" title="${d.closed?'標記未收':'標記收款'}" onclick="toggleStatus(${d.id})">${d.closed?'↩':'✓'}</button>
        <button class="icon-btn" title="刪除" onclick="deleteItem(${d.id})" style="color:#A32D2D">✕</button>
      </td>
    </tr>
  `).join('');
  rows.filter(d=>d.editing).forEach(d=>{
    const el=document.getElementById(`edit-${d.id}-${d.editing}`);
    if(el){el.focus();el.select();}
  });
  updateSelTotal();
}

function startEdit(id,field){
  data.forEach(d=>delete d.editing);
  const d=data.find(d=>d.id===id);
  if(d){d.editing=field;}
  renderTable();
}

function commitEdit(id,field){
  const d=data.find(d=>d.id===id);
  if(!d)return;
  const el=document.getElementById(`edit-${id}-${field}`);
  if(el){
    const val=field==='amount'?parseFloat(el.value)||0:el.value;
    d[field]=val;
  }
  delete d.editing;
  save();renderTable();updateStats();
}

function editKey(e,id,field){
  if(e.key==='Enter'){commitEdit(id,field);}
  if(e.key==='Escape'){const d=data.find(d=>d.id===id);if(d)delete d.editing;renderTable();}
}

function openEditModal(id){
  const d=data.find(d=>d.id===id);
  if(!d)return;
  const html=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><h2>編輯項目</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
      <div class="form-row">
        <div class="form-group"><label>日期</label><input type="date" id="m-date" value="${d.date}"></div>
        <div class="form-group"><label>金額 NT$</label><input type="number" id="m-amount" value="${d.amount}"></div>
      </div>
      <div class="form-group"><label>客戶名稱</label><input type="text" id="m-client" value="${d.client}"></div>
      <div class="form-group"><label>項目名稱</label><input type="text" id="m-project" value="${d.project}"></div>
      <div class="form-group"><label>詳細內容</label><textarea id="m-detail">${d.detail||''}</textarea></div>
      <div class="checkbox-row"><input type="checkbox" id="m-closed" ${d.closed?'checked':''}><label for="m-closed">已結案 / 已收款</label></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveModal(${id})">儲存</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-container').innerHTML=html;
}

function saveModal(id){
  const d=data.find(d=>d.id===id);
  if(!d)return;
  d.date=document.getElementById('m-date').value;
  d.client=document.getElementById('m-client').value.trim();
  d.project=document.getElementById('m-project').value.trim();
  d.detail=document.getElementById('m-detail').value.trim();
  d.amount=parseFloat(document.getElementById('m-amount').value)||0;
  d.closed=document.getElementById('m-closed').checked;
  save();closeModal();renderTable();updateStats();
}

function closeModal(){document.getElementById('modal-container').innerHTML='';}

function toggleCheck(id,el){
  const d=data.find(d=>d.id===id);
  if(d)d.checked=el.checked;
  save();renderTable();updateStats();
}

function checkAll(el){
  getFiltered().forEach(d=>d.checked=el.checked);
  save();renderTable();updateStats();
}

function toggleAll(){
  const rows=getFiltered();
  const allChecked=rows.every(d=>d.checked);
  rows.forEach(d=>d.checked=!allChecked);
  save();renderTable();updateStats();
}

function toggleStatus(id){
  const d=data.find(d=>d.id===id);
  if(d){d.closed=!d.closed;save();renderTable();updateStats();}
}

function deleteItem(id){
  if(!confirm('確定刪除此項目？'))return;
  data=data.filter(d=>d.id!==id);
  save();renderTable();updateStats();
}

function deleteSelected(){
  const sel=data.filter(d=>d.checked);
  if(!sel.length)return;
  if(!confirm(`確定刪除 ${sel.length} 個項目？`))return;
  data=data.filter(d=>!d.checked);
  save();renderTable();updateStats();
}

function markPaidSelected(){
  data.filter(d=>d.checked).forEach(d=>{d.closed=true;d.checked=false;});
  save();renderTable();updateStats();
}

function updateSelectedActions(){
  const hasSel=data.some(d=>d.checked);
  document.getElementById('btn-del').style.display=hasSel?'':'none';
  document.getElementById('btn-pay').style.display=hasSel?'':'none';
}

function updateStats(){
  document.getElementById('stat-total').textContent=data.length;
  const pending=data.filter(d=>!d.closed).reduce((s,d)=>s+Number(d.amount),0);
  const paid=data.filter(d=>d.closed).reduce((s,d)=>s+Number(d.amount),0);
  document.getElementById('stat-pending').textContent=fmtAmt(pending);
  document.getElementById('stat-paid').textContent=fmtAmt(paid);
}

function updateSelTotal(){
  const total=data.filter(d=>d.checked).reduce((s,d)=>s+Number(d.amount),0);
  document.getElementById('sel-total-val').textContent=fmtAmt(total);
}

function setFilter(f,el){

function exportCSV(){
  const header='id,date,client,project,detail,amount,closed';
  const rows=data.map(d=>[d.id,d.date,`"${d.client}"`,`"${d.project}"`,`"${(d.detail||'').replace(/"/g,'""')}"`,d.amount,d.closed?1:0].join(','));
  const csv=[header,...rows].join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='電商神助手-資料.csv';
  a.click();
}

function importCSV(){document.getElementById('csv-file').click();}

function handleCSV(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split('\n').filter(l=>l.trim());
    const imported=[];
    for(let i=1;i<lines.length;i++){
      const parts=lines[i].match(/(".*?"|[^,]+)(?=,|$)/g)||[];
      const clean=parts.map(p=>p.replace(/^"|"$/g,'').replace(/""/g,'"'));
      if(clean.length>=6){
        imported.push({id:nextId++,date:clean[1]||today(),client:clean[2]||'',project:clean[3]||'',detail:clean[4]||'',amount:parseFloat(clean[5])||0,closed:clean[6]==='1',checked:false});
      }
    }
    if(imported.length){
      if(confirm(`匯入 ${imported.length} 筆資料？（將新增到現有資料）`)){
        data=[...data,...imported];
        save();renderTable();updateStats();
      }
    }else{alert('未找到可匯入的資料，請確認 CSV 格式。');}
    e.target.value='';
  };
  reader.readAsText(file,'UTF-8');
}

renderTable();updateStats();

const GAS_URL_KEY = 'inv_gas_url';

function saveGasUrl() {
  const url = document.getElementById('gas-url').value.trim();
  localStorage.setItem(GAS_URL_KEY, url);
  updateSyncBadge(url ? 'ready' : 'unset');
}

function loadGasUrl() {
  const defaultUrl = 'https://script.google.com/macros/s/AKfycbzh2waoReNYDWVVyWeTawXmVXqz1EIdyhn6od1buZmKJtDWY2akdUDLcxndnhyZiEdmNA/exec';
  const stored = localStorage.getItem(GAS_URL_KEY);
  const url = stored || defaultUrl;
  if (!stored) localStorage.setItem(GAS_URL_KEY, defaultUrl);
  document.getElementById('gas-url').value = url;
  updateSyncBadge(url ? 'ready' : 'unset');
}

function updateSyncBadge(state, msg) {
  const badge = document.getElementById('sync-badge');
  badge.className = 'sync-status';
  if (state === 'unset')   { badge.classList.add('sync-warn');    badge.textContent = '未設定'; }
  if (state === 'ready')   { badge.classList.add('sync-ok');      badge.textContent = '已連線'; }
  if (state === 'loading') { badge.classList.add('sync-loading'); badge.textContent = '⏳ 同步中...'; }
  if (state === 'ok')      { badge.classList.add('sync-ok');      badge.textContent = '✓ ' + (msg||'成功'); }
  if (state === 'error')   { badge.classList.add('sync-err');     badge.textContent = '✗ 失敗'; }
}

function setLastSyncTime() {
  const now = new Date().toLocaleString('zh-TW', {hour12: false});
  document.getElementById('sync-time').textContent = '上次同步：' + now;
}

// ── 推送：網站 → Sheets ─────────────────────────────────────
async function syncToSheet() {
  const url = (localStorage.getItem(GAS_URL_KEY) || '').trim();
  if (!url) { alert('請先填入 Apps Script 網址！'); return; }

  updateSyncBadge('loading');
  try {
    const payload = { action: 'sync', data: data };
    const resp = await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    // no-cors 無法讀取 response，只要不拋錯就視為成功
    updateSyncBadge('ok', '已推送');
    setLastSyncTime();
  } catch (err) {
    updateSyncBadge('error');
    alert('推送失敗：' + err.message + '\n請確認 Apps Script 已部署為「允許所有人」存取。');
  }
}

// ── 拉取：Sheets → 網站 ─────────────────────────────────────
async function syncFromSheet() {
  const url = (localStorage.getItem(GAS_URL_KEY) || '').trim();
  if (!url) { alert('請先填入 Apps Script 網址！'); return; }

  updateSyncBadge('loading');
  try {
    const resp = await fetch(url + '?t=' + Date.now(), { method: 'GET' });
    const json = await resp.json();
    if (!json.success) throw new Error(json.error || '未知錯誤');

    const incoming = json.data;
    if (!Array.isArray(incoming)) throw new Error('資料格式錯誤');

    // 合併策略：以 Sheet 資料為主，重設 checked
    const merged = incoming.map(d => ({ ...d, checked: false }));
    data = merged;
    nextId = data.length ? Math.max(...data.map(d => d.id)) + 1 : 1;
    save();
    renderTable();
    updateStats();
    updateSyncBadge('ok', '已拉取 ' + incoming.length + ' 筆');
    setLastSyncTime();
  } catch (err) {
    updateSyncBadge('error');
    alert('拉取失敗：' + err.message + '\n\n提示：\n1. 確認 Apps Script 已部署\n2. 執行權限設為「所有人」\n3. 試算表 URL 正確');
  }
}

function downloadPNG(){
  const docEl=document.getElementById('doc-content');
  if(!docEl){alert('請先開啟文件預覽');return;}
  const d=window._docDownload;
  if(typeof html2canvas==='undefined'){alert('PNG 功能載入中，請稍後再試');return;}
  const btn=event.target;
  btn.textContent='產生中...';
  btn.disabled=true;
  html2canvas(docEl,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false}).then(canvas=>{
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download=`${d.title}-${d.docNo}.png`;
    a.click();
    btn.textContent='下載 PNG';
    btn.disabled=false;
  }).catch(err=>{
    alert('PNG 產生失敗：'+err);
    btn.textContent='下載 PNG';
    btn.disabled=false;
  });
}
